name: Production deploy

on:
  push:
    branches: [production]

permissions:
  contents: read

jobs:
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/production'
    runs-on: ubuntu-latest
    concurrency:
      group: eduquas-production
      cancel-in-progress: false
    steps:
      - name: Deploy production commit
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script_stop: true
          script: |
            set -eu
            cd /srv/app/EduQuas
            git fetch origin production
            git checkout production
            git pull --ff-only origin production
            test "$(git rev-parse HEAD)" = "${{ github.sha }}" || { echo "Production branch moved; deploy stopped."; exit 1; }
            docker compose build
            docker compose run --rm --no-deps backend node scripts/migrate-deploy.mjs
            docker compose up -d --wait --wait-timeout 180
