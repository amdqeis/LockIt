name: Production deploy

on:
  push:
    branches: [production]
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Image tag to deploy (e.g. sha-xxxxxxx). Leave empty to build and deploy current commit.'
        required: false
        default: ''

permissions:
  contents: read
  packages: write

concurrency:
  group: eduquas-production
  cancel-in-progress: false

jobs:
  build-and-push:
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.image_tag == '')
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.tag.outputs.val }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compute short SHA tag
        id: tag
        run: echo "val=sha-$(echo ${{ github.sha }} | cut -c1-7)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Backend
        id: meta-backend
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/backend
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=latest

      - name: Build and push Backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Extract metadata for Frontend
        id: meta-frontend
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/frontend
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=latest

      - name: Build and push Frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  deploy:
    needs: [build-and-push]
    if: always() && !cancelled() && !contains(needs.*.result, 'failure')
    runs-on: ubuntu-latest
    steps:
      - name: Determine target image tag
        id: deploy_tag
        run: |
          if [ -n "${{ github.event.inputs.image_tag }}" ]; then
            echo "val=${{ github.event.inputs.image_tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "val=${{ needs.build-and-push.outputs.image_tag }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy production commit
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script_stop: true
          script: |
            set -eu
            cd /srv/app/EduQuas
            git fetch origin production
            git checkout production
            git pull --ff-only origin production
            test "${{ github.event_name }}" != "push" || test "$(git rev-parse HEAD)" = "${{ github.sha }}" || { echo "Production branch moved; deploy stopped."; exit 1; }
            DEPLOY_TAG="${{ steps.deploy_tag.outputs.val }}"
            touch .env
            sed -i '/^IMAGE_TAG=/d' .env
            echo "IMAGE_TAG=${DEPLOY_TAG}" >> .env
            docker compose pull
            docker compose run --rm --no-deps backend node scripts/migrate-deploy.mjs
            docker compose up -d --remove-orphans --wait --wait-timeout 180
            docker compose ps
            docker image prune -f
