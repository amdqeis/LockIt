services:
  backend:
    image: ${REGISTRY:-ghcr.io/amdqeis/lockit}/backend:${IMAGE_TAG:-latest}
    container_name: eduquas_backend
    env_file:
      - ./backend/.env
    environment:
      NODE_ENV: production
      PORT: 3000
      REDIS_URL: ""
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:3001:3000"
    volumes:
      - question_bank_media:/app/storage/question-bank
      - exam_uploads:/app/public/uploads/exams
      - backup_storage:/app/storage/backups
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:3000/api/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - caddy_net

  frontend:
    image: ${REGISTRY:-ghcr.io/amdqeis/lockit}/frontend:${IMAGE_TAG:-latest}
    container_name: eduquas_frontend
    environment:
      NODE_ENV: production
      INTERNAL_BACKEND_URL: http://backend:3000
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - caddy_net

volumes:
  question_bank_media:
  exam_uploads:
  backup_storage:

networks:
  caddy_net:
    external: true
