services:
  backend:
    build:
      context: ./backend
    container_name: eduquas_backend
    env_file:
      - ./backend/.env
    environment:
      NODE_ENV: production
      PORT: 3000
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:3001:3000"
    volumes:
      - question_bank_media:/app/storage/question-bank
      - exam_uploads:/app/public/uploads/exams
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:3000/api/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - caddy_net
      - cache_net

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    networks:
      - cache_net

  frontend:
    build:
      context: ./frontend
    container_name: eduquas_frontend
    environment:
      NODE_ENV: production
      INTERNAL_BACKEND_URL: http://backend:3000
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - caddy_net

volumes:
  question_bank_media:
  exam_uploads:

networks:
  caddy_net:
    external: true
  cache_net:
    internal: true
