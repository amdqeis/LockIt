services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: eduquas_backend
    env_file:
      - ./backend/.env
    restart: unless-stopped
    # Agar container bisa akses DB di host machine (Linux) jika DATABASE_URL pakai host.docker.internal
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "3001:3000"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - caddy_net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # URL ini dipakai browser saat build untuk fetch ke backend
        # Di production server: bisa di-override via env host (misal via Caddy: https://api.domain.com)
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3001}
    container_name: eduquas_frontend
    environment:
      - NODE_ENV=production
      # URL internal antar-container untuk Next.js rewrites proxy (/api/* -> backend)
      - INTERNAL_BACKEND_URL=http://backend:3000
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:3001}
    depends_on:
      - backend
    restart: unless-stopped
    ports:
      - "3000:3000"
    networks:
      - caddy_net

networks:
  caddy_net:
    external: true
