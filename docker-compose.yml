services:
  postgres:
    image: postgres:16-alpine
    container_name: lockit-postgres
    restart: always
    environment:
      POSTGRES_USER: lockit_user
      POSTGRES_PASSWORD: lockit_password
      POSTGRES_DB: lockit_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lockit_user -d lockit_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: lockit-frontend
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
